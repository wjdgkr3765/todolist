<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>팀 정보 시안</title>
  <link rel="stylesheet" href="../../frontend/node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="mockup_common.css" />
  <style>
    /* TeamInfoView_screen.md "7. 디자인 값" */
    .team-info { max-width: 880px; }
    .team-name-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .team-name { font-size: 22px; font-weight: 800; word-break: break-all; margin: 0; }
    .team-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; font-size: 14px; color: var(--color-sub); }
    .team-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .name-edit { display: flex; gap: 8px; align-items: flex-start; }
    .name-edit .field { flex: 1; margin: 0; }
    .name-edit .btn-x { height: 51px; padding: 0 16px; }
    .badge-owner { background: var(--color-primary); color: #fff; }
    .badge-manager { background: var(--color-primary-soft); color: var(--color-primary-dark); }
    .badge-member { background: #f3f4f6; color: var(--color-sub); }
    .member-table td { height: 52px; }
    .member-table .col-menu { width: 48px; text-align: right; position: relative; }
    .me-mark { font-size: 13px; color: var(--color-muted); margin-left: 4px; }
    .row-menu { position: absolute; right: 8px; top: 44px; z-index: 20; width: 180px; padding: 6px; border-radius: 12px; }
    .row-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--color-ink); white-space: nowrap; }
    .row-menu-item:hover { background: var(--color-hover-bg); }
    .row-menu-item.is-danger { color: var(--color-danger); }
    .email-sub { display: none; font-size: 12px; color: var(--color-sub); }
    .invite-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); font-size: 14px; }
    .invite-row:last-child { border-bottom: 0; }
    .invite-who { flex: 1; min-width: 0; }
    .invite-who b { font-weight: 600; }
    .invite-who small { color: var(--color-sub); margin-left: 6px; }
    .invite-meta { color: var(--color-sub); font-size: 13px; white-space: nowrap; }
    .bottom-action { margin-top: 20px; }
    .confirm-name { font-weight: 800; }
    @media (max-width: 767.98px) {
      .member-table .col-email { display: none; }
      .email-sub { display: block; }
      .invite-who small { display: block; margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- 시안 (D-146, D-149): 서버 없이 이 화면 안에서만 동작한다. 가짜 데이터라 새로고침하면 처음 상태로 돌아간다 -->
  <div class="mockup-bar"><span>시안 상태</span><select id="state-select" class="form-select form-select-sm"></select><span>· 화면 문서: TeamInfoView_screen.md · 나는 홍길동</span></div>

  <div class="main-layout">
    <nav id="side-nav" class="side-nav" aria-label="공간"></nav>
    <nav id="menu-tabs" class="menu-tabs" aria-label="메뉴"></nav>
    <main class="content">
      <div class="team-info">
        <div id="page-loading" class="card-x loading-box is-hidden"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>불러오는 중...</div>
        <div id="page-body">
          <!-- 팀 정보 카드 -->
          <section class="card-x">
            <div id="name-read" class="team-name-row">
              <h1 id="team-name" class="team-name"></h1>
              <button type="button" id="btn-name-edit" class="btn-x btn-soft-x"><i class="bi bi-pencil"></i>이름 수정</button>
            </div>
            <div id="name-edit" class="name-edit is-hidden">
              <div class="field">
                <div id="ctl-team-rename" class="control no-icon"><input id="team-rename" type="text" maxlength="20" aria-label="팀 이름" /></div>
                <div id="rename-error" class="message is-error is-hidden"><i class="bi bi-exclamation-circle"></i><span id="rename-error-text">팀 이름을 입력해 주세요.</span></div>
              </div>
              <button type="button" id="btn-rename-cancel" class="btn-x btn-outline-x">취소</button>
              <button type="button" id="btn-rename-save" class="btn-x btn-primary-x">저장</button>
            </div>
            <div class="team-meta">
              <span><i class="bi bi-person-badge"></i><span id="owner-nickname"></span></span>
              <span><i class="bi bi-people"></i><span><span id="member-count"></span>명</span></span>
              <span><i class="bi bi-calendar"></i><span id="team-date"></span></span>
            </div>
          </section>

          <!-- 팀원 게시판 -->
          <section class="card-x">
            <div class="card-title-x"><span>팀원 <span id="member-title-count"></span></span>
              <button type="button" id="btn-invite" class="btn-x btn-primary-x" style="height:40px;padding:0 16px;border-radius:10px;font-weight:700"><i class="bi bi-person-plus"></i>초대</button></div>
            <table class="table-x member-table">
              <thead><tr><th>닉네임</th><th class="col-email">이메일</th><th>역할</th><th>합류일</th><th class="col-menu"></th></tr></thead>
              <tbody id="member-body"></tbody>
            </table>
          </section>

          <!-- 답을 기다리는 초대 -->
          <section id="invite-section" class="card-x">
            <div class="card-title-x"><span>답을 기다리는 초대 <span id="invite-count"></span></span></div>
            <div id="invite-list"></div>
          </section>

          <div class="bottom-action">
            <button type="button" id="btn-dissolve" class="btn-x btn-danger-x btn-lg-x btn-block-x"><i class="bi bi-trash"></i>팀 해체</button>
            <button type="button" id="btn-leave" class="btn-x btn-outline-danger-x btn-lg-x btn-block-x is-hidden"><i class="bi bi-box-arrow-left"></i>팀 탈퇴</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 초대 모달 -->
  <div id="invite-modal" class="modal-backdrop-x is-hidden">
    <div class="modal-x" role="dialog" aria-label="팀원 초대">
      <div class="modal-title-x">팀원 초대</div>
      <p class="modal-sub" style="margin:0 0 16px">초대할 회원의 이메일을 입력해 주세요. 상대가 알림에서 수락하면 팀에 들어옵니다.</p>
      <div class="field" style="margin:0">
        <label class="field-label" for="invite-email">이메일</label>
        <div id="ctl-invite-email" class="control"><span class="control-icon"><i class="bi bi-envelope"></i></span><input id="invite-email" type="email" maxlength="100" placeholder="example@email.com" /></div>
        <div id="invite-error" class="message is-error is-hidden"><i class="bi bi-exclamation-circle"></i><span id="invite-error-text"></span></div>
      </div>
      <p class="modal-sub" style="margin:10px 0 0;font-size:12px">시안 예시: nobody@ / minsu@ / sujin.choi@ / declined@ / mailfail@ 뒤에 example.com 을 붙이면 각 오류·안내를 볼 수 있다</p>
      <div class="modal-actions"><button type="button" id="btn-invite-cancel" class="btn-x btn-outline-x">취소</button><button type="button" id="btn-invite-send" class="btn-x btn-primary-x">초대</button></div>
    </div>
  </div>

  <!-- 확인창 (문구는 경우마다 바뀐다) -->
  <div id="confirm" class="modal-backdrop-x is-hidden">
    <div class="modal-x" role="dialog" aria-label="확인">
      <div id="confirm-title" class="modal-title-x"></div>
      <div id="confirm-text" class="modal-text"></div>
      <div id="dissolve-input" class="field is-hidden" style="margin:14px 0 0">
        <div class="control no-icon"><input id="dissolve-name" type="text" maxlength="20" placeholder="팀 이름 입력" aria-label="팀 이름 입력" /></div>
      </div>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel" class="btn-x btn-outline-x">취소</button>
        <button type="button" id="confirm-ok" class="btn-x btn-primary-x">확인</button>
      </div>
    </div>
  </div>

  <script src="../../frontend/node_modules/sortablejs/Sortable.min.js"></script>
  <script src="mockup_common.js"></script>
  <script src="team_info_view.js"></script>
</body>
</html>
