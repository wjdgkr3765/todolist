<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>팀 정보 시안</title>
  <link rel="stylesheet" href="../../frontend/node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="mockup_common.css" />
  <style>
    /* TeamInfoView_screen.md "7. 디자인 값" */
    .team-info { max-width: 880px; }
    .team-name-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .team-name { font-size: 22px; font-weight: 800; word-break: break-all; margin: 0; }
    .team-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; font-size: 14px; color: var(--color-sub); }
    .team-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .name-edit { display: flex; gap: 8px; align-items: flex-start; }
    .name-edit .field { flex: 1; margin: 0; }
    .name-edit .btn-x { height: 51px; padding: 0 16px; }
    .badge-owner { background: var(--color-primary); color: #fff; }
    .badge-manager { background: var(--color-primary-soft); color: var(--color-primary-dark); }
    .badge-member { background: #f3f4f6; color: var(--color-sub); }
    .member-table td { height: 52px; }
    .member-table .col-menu { width: 48px; text-align: right; position: relative; }
    .me-mark { font-size: 13px; color: var(--color-muted); margin-left: 4px; }
    .row-menu { position: absolute; right: 8px; top: 44px; z-index: 20; width: 180px; padding: 6px; border-radius: 12px; }
    .row-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; border: 0; background: transparent; border-radius: 8px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--color-ink); white-space: nowrap; }
    .row-menu-item:hover { background: var(--color-hover-bg); }
    .row-menu-item.is-danger { color: var(--color-danger); }
    .email-sub { display: none; font-size: 12px; color: var(--color-sub); }
    .invite-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); font-size: 14px; }
    .invite-row:last-child { border-bottom: 0; }
    .invite-who { flex: 1; min-width: 0; }
    .invite-who b { font-weight: 600; }
    .invite-who small { color: var(--color-sub); margin-left: 6px; }
    .invite-meta { color: var(--color-sub); font-size: 13px; white-space: nowrap; }
    .bottom-action { margin-top: 20px; }
    .confirm-name { font-weight: 800; }
    @media (max-width: 767.98px) {
      .member-table .col-email { display: none; }
      .email-sub { display: block; }
      .invite-who small { display: block; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="mockup-bar"><span>시안 상태</span><select id="state-select" class="form-select form-select-sm"></select><span>· 화면 문서: TeamInfoView_screen.md</span></div>

  <div class="main-layout">
    <nav id="side-nav" class="side-nav" aria-label="공간"></nav>
    <nav id="menu-tabs" class="menu-tabs" aria-label="메뉴"></nav>
    <main class="content">
      <div class="team-info">
        <div id="page-loading" class="card-x loading-box is-hidden"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>불러오는 중...</div>
        <div id="page-body">
          <!-- 팀 정보 카드 -->
          <section class="card-x">
            <div id="name-read" class="team-name-row">
              <h1 class="team-name">디자인팀</h1>
              <button type="button" id="btn-name-edit" class="btn-x btn-soft-x"><i class="bi bi-pencil"></i>이름 수정</button>
            </div>
            <div id="name-edit" class="name-edit is-hidden">
              <div class="field">
                <div id="ctl-team-rename" class="control no-icon"><input id="team-rename" type="text" maxlength="20" value="디자인팀" aria-label="팀 이름" /></div>
                <div id="rename-error" class="message is-error is-hidden"><i class="bi bi-exclamation-circle"></i><span id="rename-error-text">팀 이름을 입력해 주세요.</span></div>
              </div>
              <button type="button" class="btn-x btn-outline-x">취소</button>
              <button type="button" id="btn-rename-save" class="btn-x btn-primary-x">저장</button>
            </div>
            <div class="team-meta">
              <span><i class="bi bi-person-badge"></i><span id="owner-nickname">홍길동</span></span>
              <span><i class="bi bi-people"></i><span><span id="member-count">4</span>명</span></span>
              <span><i class="bi bi-calendar"></i>2026.11.01</span>
            </div>
          </section>

          <!-- 팀원 게시판 -->
          <section class="card-x">
            <div class="card-title-x"><span>팀원 <span id="member-title-count">(4명)</span></span>
              <button type="button" id="btn-invite" class="btn-x btn-primary-x" style="height:40px;padding:0 16px;border-radius:10px;font-weight:700"><i class="bi bi-person-plus"></i>초대</button></div>
            <table class="table-x member-table">
              <thead><tr><th>닉네임</th><th class="col-email">이메일</th><th>역할</th><th>합류일</th><th class="col-menu"></th></tr></thead>
              <tbody id="member-body"></tbody>
            </table>
          </section>

          <!-- 답을 기다리는 초대 -->
          <section id="invite-section" class="card-x">
            <div class="card-title-x"><span>답을 기다리는 초대 (2)</span></div>
            <div class="invite-row">
              <div class="invite-who"><b>최수진</b><small>sujin.choi@example.com</small></div>
              <span class="invite-meta">홍길동님이 초대 · 2026.11.10</span>
              <button type="button" class="btn-x btn-outline-x invite-cancel">취소</button>
            </div>
            <div class="invite-row">
              <div class="invite-who"><b>정다은</b><small>daeun@example.com</small></div>
              <span class="invite-meta">이영희님이 초대 · 2026.11.11</span>
              <button type="button" class="btn-x btn-outline-x invite-cancel invite-cancel-other">취소</button>
            </div>
          </section>

          <div class="bottom-action">
            <button type="button" id="btn-dissolve" class="btn-x btn-danger-x btn-lg-x btn-block-x"><i class="bi bi-trash"></i>팀 해체</button>
            <button type="button" id="btn-leave" class="btn-x btn-outline-danger-x btn-lg-x btn-block-x is-hidden"><i class="bi bi-box-arrow-left"></i>팀 탈퇴</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 초대 모달 -->
  <div id="invite-modal" class="modal-backdrop-x is-hidden">
    <div class="modal-x" role="dialog" aria-label="팀원 초대">
      <div class="modal-title-x">팀원 초대</div>
      <p class="modal-sub" style="margin:0 0 16px">초대할 회원의 이메일을 입력해 주세요. 상대가 알림에서 수락하면 팀에 들어옵니다.</p>
      <div class="field" style="margin:0">
        <label class="field-label" for="invite-email">이메일</label>
        <div id="ctl-invite-email" class="control"><span class="control-icon"><i class="bi bi-envelope"></i></span><input id="invite-email" type="email" maxlength="100" placeholder="example@email.com" /></div>
        <div id="invite-error" class="message is-error is-hidden"><i class="bi bi-exclamation-circle"></i><span id="invite-error-text"></span></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn-x btn-outline-x">취소</button><button type="button" id="btn-invite-send" class="btn-x btn-primary-x">초대</button></div>
    </div>
  </div>

  <!-- 확인창 (문구는 상태마다 바뀐다) -->
  <div id="confirm" class="modal-backdrop-x is-hidden">
    <div class="modal-x" role="dialog" aria-label="확인">
      <div id="confirm-title" class="modal-title-x"></div>
      <div id="confirm-text" class="modal-text"></div>
      <div id="dissolve-input" class="field is-hidden" style="margin:14px 0 0">
        <div class="control no-icon"><input id="dissolve-name" type="text" maxlength="20" placeholder="팀 이름 입력" aria-label="팀 이름 입력" /></div>
      </div>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel" class="btn-x btn-outline-x">취소</button>
        <a href="#" id="confirm-ok" class="btn-x btn-primary-x">확인</a>
      </div>
    </div>
  </div>

  <script src="mockup_common.js"></script>
  <script>
    renderLayout({ space: 'team', tab: 'info', hideTabs: false });

    const MEMBERS = [
      { nickname: '홍길동', email: 'user@example.com', role: 'owner', join: '2026.11.01', me: true },
      { nickname: '이영희', email: 'younghee@example.com', role: 'manager', join: '2026.11.02' },
      { nickname: '김민수', email: 'minsu@example.com', role: 'member', join: '2026.11.03' },
      { nickname: '박지성', email: 'jisung.park@example.com', role: 'member', join: '2026.11.05' },
    ];
    const ROLE_LABEL = { owner: '관리자', manager: '부관리자', member: '팀원' };

    // 내 역할에 따라 그 행에서 할 수 있는 메뉴 (TeamInfoView_screen.md "행 메뉴 항목")
    function menuItems(myRole, target) {
      if (target.me || target.role === 'owner') { return []; }
      if (myRole === 'owner') {
        return [target.role === 'manager' ? '부관리자 해제' : '부관리자 지정', '관리자 넘기기', '내보내기'];
      }
      if (myRole === 'manager' && target.role === 'member') { return ['내보내기']; }
      return [];
    }

    const ROLE_ORDER = { owner: 0, manager: 1, member: 2 };
    function renderMembers(myRole, unsorted, openMenuIndex) {
      // 관리자 → 부관리자 → 팀원, 같은 역할은 먼저 합류한 순 (D-076)
      const members = [...unsorted].sort((a, b) => ROLE_ORDER[a.role] - ROLE_ORDER[b.role] || a.join.localeCompare(b.join));
      $('owner-nickname').textContent = members[0].nickname;
      $('member-body').innerHTML = members.map((member, index) => {
        const items = menuItems(myRole, member);
        const menu = items.length
          ? `<button type="button" class="icon-button" aria-label="팀원 메뉴"><i class="bi bi-three-dots-vertical"></i></button>${index === openMenuIndex
            ? `<div class="popover-box row-menu">${items.map((item) => `<button type="button" class="row-menu-item${item === '내보내기' ? ' is-danger' : ''}">${item}</button>`).join('')}</div>` : ''}`
          : '';
        return `<tr><td>${member.nickname}${member.me ? '<span class="me-mark">(나)</span>' : ''}<span class="email-sub">${member.email}</span></td>
          <td class="col-email">${member.email}</td><td><span class="badge-x badge-${member.role}">${ROLE_LABEL[member.role]}</span></td>
          <td>${member.join}</td><td class="col-menu">${menu}</td></tr>`;
      }).join('');
      $('member-count').textContent = members.length;
      $('member-title-count').textContent = `(${members.length}명)`;
    }

    // 역할별 보기: 관리자는 [팀 해체], 부관리자·팀원은 [팀 탈퇴], 팀원은 [이름 수정] 없음. 초대 [취소]는 초대한 본인과 관리자·부관리자
    function viewAs(myRole, members, openMenuIndex) {
      const me = members.find((member) => member.me);
      me.role = myRole;
      renderMembers(myRole, members, openMenuIndex);
      $('btn-name-edit').classList.toggle('is-hidden', myRole === 'member');
      $('btn-dissolve').classList.toggle('is-hidden', myRole !== 'owner');
      $('btn-leave').classList.toggle('is-hidden', myRole === 'owner');
      document.querySelectorAll('.invite-cancel-other').forEach((button) => button.classList.toggle('is-hidden', myRole === 'member'));
    }
    function asOwner(openMenuIndex) { viewAs('owner', MEMBERS.map((member) => ({ ...member })), openMenuIndex); }

    function openConfirm(title, text, okLabel, okKind, okHref) {
      $('confirm-title').textContent = title;
      $('confirm-text').innerHTML = text;
      const ok = $('confirm-ok');
      ok.textContent = okLabel;
      ok.className = `btn-x ${okKind === 'danger' ? 'btn-danger-x' : 'btn-primary-x'}`;
      ok.setAttribute('href', okHref || '#');
      show('confirm');
    }
    function openInvite(errorText) {
      show('invite-modal');
      if (errorText) { $('invite-email').value = 'someone@example.com'; $('ctl-invite-email').classList.add('is-invalid'); $('invite-error-text').textContent = errorText; show('invite-error'); }
    }

    addToast('toast-renamed', 'success', '팀 이름을 바꿨습니다.', '');
    addToast('toast-invited', 'success', '초대했습니다.', '');
    addToast('toast-invited-nomail', 'success', '초대했지만 안내 메일은 보내지 못했습니다.', '');
    addToast('toast-invite-canceled', 'success', '초대를 취소했습니다.', '');
    addToast('toast-role', 'success', '부관리자로 지정했습니다.', '');
    addToast('toast-owner', 'success', '관리자를 넘겼습니다.', '');
    addToast('toast-removed', 'success', '김민수님을 내보냈습니다.', '');
    addToast('toast-forbidden', 'error', '권한이 없습니다.', '');
    addToast('toast-member-gone', 'error', '이미 팀에 없는 회원입니다.', '');
    addToast('toast-name-mismatch', 'error', '팀 이름이 맞지 않습니다.', '');
    addToast('toast-invite-gone', 'error', '이미 답했거나 취소된 초대입니다.', '');
    addToast('toast-server', 'error', '일시적인 오류가 발생했습니다.', '잠시 후 다시 시도해 주세요.');

    function resetState() {
      hideAllToasts();
      ['page-loading', 'name-edit', 'rename-error', 'invite-modal', 'invite-error', 'confirm', 'dissolve-input'].forEach((id) => hide(id));
      show('page-body', 'name-read', 'invite-section');
      $('ctl-team-rename').classList.remove('is-invalid');
      $('ctl-invite-email').classList.remove('is-invalid');
      $('invite-email').value = '';
      $('dissolve-name').value = '';
      ['btn-rename-save', 'btn-invite-send'].forEach((id) => { $(id).disabled = false; });
      $('btn-rename-save').textContent = '저장';
      $('btn-invite-send').textContent = '초대';
      $('confirm-ok').classList.remove('disabled');
      asOwner(-1);
    }

    const DISSOLVE_STEP1 = '팀을 해체하려면 팀 이름을 입력해 주세요.<br /><span class="confirm-name">디자인팀</span>';
    const STATES = {
      'owner': { label: '관리자로 봄', run: () => {} },
      'manager': { label: '부관리자로 봄', run: () => viewAs('manager', MEMBERS.map((member) => ({ ...member, role: member.me ? 'manager' : (member.nickname === '이영희' ? 'owner' : member.role) }))) },
      'member': { label: '팀원으로 봄', run: () => viewAs('member', MEMBERS.map((member) => ({ ...member, role: member.me ? 'member' : (member.nickname === '이영희' ? 'owner' : member.role) }))) },
      'alone': { label: '혼자 남은 관리자', run: () => { viewAs('owner', [{ ...MEMBERS[0] }]); hide('invite-section'); } },
      'loading': { label: '로딩 중', run: () => { hide('page-body'); show('page-loading'); } },
      'rename': { label: '이름 수정 중', run: () => { hide('name-read'); show('name-edit'); } },
      'rename-error': { label: '이름 입력 오류', run: () => { hide('name-read'); show('name-edit', 'rename-error'); $('team-rename').value = ''; $('ctl-team-rename').classList.add('is-invalid'); } },
      'rename-saving': { label: '이름 저장 중', run: () => { hide('name-read'); show('name-edit'); setLoading($('btn-rename-save'), '저장 중...'); } },
      'renamed': { label: '이름 수정 완료 토스트', run: () => show('toast-renamed') },
      'row-menu-owner': { label: '행 메뉴 열림 (관리자 → 팀원)', run: () => asOwner(2) },
      'row-menu-manager-target': { label: '행 메뉴 열림 (관리자 → 부관리자)', run: () => asOwner(1) },
      'row-menu-by-manager': { label: '행 메뉴 열림 (부관리자 → 팀원)', run: () => viewAs('manager', MEMBERS.map((member) => ({ ...member, role: member.me ? 'manager' : (member.nickname === '이영희' ? 'owner' : member.role) })), 2) },
      'role-done': { label: '부관리자 지정 완료', run: () => show('toast-role') },
      'confirm-owner': { label: '확인창: 관리자 넘기기', run: () => openConfirm('관리자 넘기기', '김민수님에게 관리자를 넘길까요? 넘기면 나는 부관리자가 됩니다.', '넘기기', 'primary') },
      'owner-done': { label: '관리자 넘기기 완료 (부관리자 기준 화면)', run: () => { viewAs('manager', MEMBERS.map((member) => ({ ...member, role: member.me ? 'manager' : (member.nickname === '김민수' ? 'owner' : member.role) }))); show('toast-owner'); } },
      'confirm-remove': { label: '확인창: 내보내기', run: () => openConfirm('내보내기', '김민수님을 팀에서 내보낼까요? 이 회원이 맡은 작업의 작업자에서도 빠집니다.', '내보내기', 'danger') },
      'removed': { label: '내보내기 완료', run: () => { viewAs('owner', MEMBERS.filter((member) => member.nickname !== '김민수').map((member) => ({ ...member }))); show('toast-removed'); } },
      'confirm-leave': { label: '확인창: 팀 탈퇴 (→ 개인 작업)', run: () => { viewAs('member', MEMBERS.map((member) => ({ ...member, role: member.me ? 'member' : (member.nickname === '이영희' ? 'owner' : member.role) }))); openConfirm('팀 탈퇴', '디자인팀 팀에서 탈퇴할까요? 내가 맡은 작업의 작업자에서도 빠집니다.', '탈퇴', 'danger', 'task_view.html'); } },
      'confirm-dissolve-1': { label: '확인창: 팀 해체 1단계 (입력 전, [다음] 꺼짐)', run: () => { openConfirm('팀 해체', DISSOLVE_STEP1, '다음', 'danger'); show('dissolve-input'); $('confirm-ok').classList.add('disabled'); } },
      'confirm-dissolve-1-ok': { label: '확인창: 팀 해체 1단계 (이름 일치)', run: () => { openConfirm('팀 해체', DISSOLVE_STEP1, '다음', 'danger'); show('dissolve-input'); $('dissolve-name').value = '디자인팀'; } },
      'confirm-dissolve-2': { label: '확인창: 팀 해체 2단계 (→ 개인 작업)', run: () => openConfirm('팀 해체', '정말 삭제할까요? 되돌릴 수 없습니다.', '삭제', 'danger', 'task_view.html') },
      'dissolving': { label: '해체 처리 중', run: () => { openConfirm('팀 해체', '정말 삭제할까요? 되돌릴 수 없습니다.', '삭제', 'danger'); $('confirm-ok').innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>삭제 중...'; $('confirm-ok').classList.add('disabled'); } },
      'invite': { label: '초대 모달 (입력 전)', run: () => openInvite() },
      'invite-format': { label: '초대 입력 오류 (형식)', run: () => openInvite('이메일 형식이 올바르지 않습니다.') },
      'invite-sending': { label: '초대 중', run: () => { openInvite(); $('invite-email').value = 'someone@example.com'; setLoading($('btn-invite-send'), '초대 중...'); } },
      'invite-not-user': { label: '초대 오류: 가입된 회원 아님', run: () => openInvite('가입된 회원이 아닙니다.') },
      'invite-member': { label: '초대 오류: 이미 팀원', run: () => openInvite('이미 팀원인 회원입니다.') },
      'invite-dup': { label: '초대 오류: 이미 초대함', run: () => openInvite('이미 초대한 회원입니다.') },
      'invite-declined': { label: '초대 오류: 24시간 안에 거절함', run: () => openInvite('초대를 거절한 회원입니다. 거절한 때부터 24시간 뒤에 다시 초대할 수 있습니다.') },
      'invited': { label: '초대 완료', run: () => show('toast-invited') },
      'invited-nomail': { label: '초대 완료 (메일 실패)', run: () => show('toast-invited-nomail') },
      'confirm-invite-cancel': { label: '확인창: 초대 취소', run: () => { openConfirm('초대 취소', '최수진님에게 보낸 초대를 취소할까요?', '초대 취소', 'danger'); $('confirm-cancel').textContent = '닫기'; } },
      'invite-canceled': { label: '초대 취소 완료', run: () => show('toast-invite-canceled') },
      'error-403': { label: '오류: 권한 없음 (403)', run: () => show('toast-forbidden') },
      'error-404-member': { label: '오류: 이미 팀에 없는 회원', run: () => show('toast-member-gone') },
      'error-name-mismatch': { label: '오류: 팀 이름 불일치', run: () => show('toast-name-mismatch') },
      'error-invite-gone': { label: '오류: 이미 없는 초대', run: () => show('toast-invite-gone') },
      'server-error': { label: '서버 오류', run: () => show('toast-server') },
    };
    setupStates(STATES, () => { resetState(); $('confirm-cancel').textContent = '취소'; });
    $('btn-invite').addEventListener('click', () => openInvite());
  </script>
</body>
</html>
