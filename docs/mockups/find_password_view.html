<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 찾기 시안</title>
  <link rel="stylesheet" href="../../frontend/node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="mockup_common.css" />
  <style>
    /* FindPasswordView_screen.md "7. 디자인 값" */
    .section-title { margin-top: 0; }
    .section-title.is-second { margin-top: 26px; }
    .change-guide { font-size: 13px; color: var(--color-sub); margin: -6px 0 14px; }
  </style>
</head>
<body class="auth-body">
  <div class="mockup-bar"><span>시안 상태</span><select id="state-select" class="form-select form-select-sm"></select><span>· 화면 문서: FindPasswordView_screen.md · 시안 규칙: 아이디 todo2026 + 이메일 user@example.com / 인증번호 123456</span></div>

  <main class="auth-page">
    <div class="auth-shell">
      <section id="brand-panel" class="brand-panel" aria-hidden="true"></section>
      <section class="form-panel">
        <h1 class="form-heading">비밀번호 찾기</h1>
        <p class="form-subheading">아이디와 가입한 이메일로 본인을 확인해요.</p>

        <div class="section-title">본인 확인</div>
        <div class="field">
          <label class="field-label" for="login-id">아이디</label>
          <div id="ctl-login-id" class="control"><span class="control-icon"><i class="bi bi-person"></i></span><input id="login-id" type="text" maxlength="15" placeholder="아이디" /></div>
          <div id="login-id-error" class="message is-error is-hidden"><i class="bi bi-exclamation-circle"></i>아이디를 입력해 주세요.</div>
        </div>
        <div class="field">
          <label class="field-label" for="email">이메일</label>
          <div class="field-row">
            <div id="ctl-email" class="control"><span class="control-icon"><i class="bi bi-envelope"></i></span><input id="email" type="email" maxlength="100" placeholder="example@email.com" />
              <span id="verified-pill" class="control-suffix is-hidden"><span class="verified-pill"><i class="bi bi-check-circle-fill"></i>인증</span></span></div>
            <button type="button" id="btn-send" class="btn-side">인증번호 발송</button>
            <button type="button" id="btn-change" class="btn-side is-hidden">변경</button>
          </div>
          <div id="email-message" class="message is-hidden"><i class="bi bi-info-circle"></i><span id="email-message-text"></span></div>
        </div>
        <div id="code-field" class="field is-hidden">
          <label class="field-label" for="code">인증번호</label>
          <div class="field-row">
            <div id="ctl-code" class="control"><span class="control-icon"><i class="bi bi-key"></i></span><input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리" />
              <span class="control-suffix"><span id="timer" class="timer-pill">4:59</span></span></div>
            <button type="button" id="btn-verify" class="btn-side">확인</button>
          </div>
          <div id="code-message" class="message is-hidden"><i class="bi bi-exclamation-circle"></i><span id="code-message-text"></span></div>
        </div>

        <div id="password-area" class="is-hidden">
          <div class="section-title is-second">새 비밀번호</div>
          <p class="change-guide">인증 후 30분 안에 변경해 주세요.</p>
          <div class="field">
            <label class="field-label" for="new-password">새 비밀번호</label>
            <div id="ctl-new" class="control"><span class="control-icon"><i class="bi bi-lock"></i></span><input id="new-password" type="password" maxlength="15" placeholder="영어, 숫자, 특수문자를 모두 포함 8~15자" />
              <span class="control-suffix"><button type="button" class="icon-button" aria-label="비밀번호 보기"><i class="bi bi-eye"></i></button></span></div>
            <div id="new-error" class="message is-error is-hidden"><i class="bi bi-exclamation-circle"></i>영어, 숫자, 특수문자를 모두 포함해 8~15자로 입력해 주세요.</div>
          </div>
          <div class="field">
            <label class="field-label" for="new-check">새 비밀번호 확인</label>
            <div id="ctl-check" class="control"><span class="control-icon"><i class="bi bi-shield-lock"></i></span><input id="new-check" type="password" maxlength="15" placeholder="새 비밀번호를 한 번 더 입력" /></div>
            <div id="check-error" class="message is-error is-hidden"><i class="bi bi-exclamation-circle"></i>비밀번호가 일치하지 않습니다.</div>
          </div>
          <a href="login_view.html?state=password-reset" id="btn-reset" class="btn-submit">비밀번호 변경</a>
        </div>

        <div class="form-footer"><a href="login_view.html">로그인으로 돌아가기</a></div>
      </section>
    </div>
  </main>

  <script src="mockup_common.js"></script>
  <script>
    renderBrandPanel();
    addToast('toast-reset', 'success', '비밀번호를 바꿨습니다.', '새 비밀번호로 로그인해 주세요.');
    addToast('toast-gone', 'error', '아이디와 이메일이 일치하는 회원이 없습니다.', '');
    addToast('toast-mail-failed', 'error', '메일을 보내지 못했습니다.', '잠시 후 다시 시도해 주세요.');
    addToast('toast-server', 'error', '일시적인 오류가 발생했습니다.', '잠시 후 다시 시도해 주세요.');


    // ---------- 동작 (D-146, D-149): 서버 없이 흉내 낸다 ----------
    // 시안 규칙: 가입된 회원 todo2026 / user@example.com, 인증번호 123456, mailfail@example.com 이면 메일 발송 실패
    const REGISTERED = { 'user@example.com': { loginId: 'todo2026', joined: '2026.11.01' }, 'mailfail@example.com': { loginId: 'mailfail1', joined: '2026.10.01' } };
    const EMAIL_RULE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let codeFails = 0;
    let codeLeft = 0;
    const timer = createCodeTimer((text, left) => {
      codeLeft = left;
      $('timer').textContent = text;
      const resend = left - 240;
      $('btn-send').disabled = resend > 0;
      $('btn-send').textContent = resend > 0 ? `재발송 ${timer.format(resend)}` : '재발송';
    }, () => {});
    function startCode() {
      codeFails = 0;
      $('code').value = '';
      $('ctl-code').classList.remove('is-invalid');
      hide('code-message');
      show('code-field');
      emailMessage('is-success', '인증번호를 보냈습니다. 메일을 확인해 주세요.');
      timer.start(300);
      $('code').focus();
    }
    // 맞으면 true. 틀림·만료·무효면 문구를 보여주고 false
    function checkCode() {
      if (codeLeft <= 0) { codeError('인증번호가 만료되었습니다. 다시 발송해 주세요.'); return false; }
      if (codeFails >= 5) { codeError('인증번호가 무효가 되었습니다. 다시 발송해 주세요.'); return false; }
      if ($('code').value !== DEMO_CODE) {
        codeFails += 1;
        codeError(codeFails >= 5 ? '인증번호가 무효가 되었습니다. 다시 발송해 주세요.' : `인증번호가 틀렸습니다. (남은 횟수 ${5 - codeFails}회)`);
        return false;
      }
      timer.stop();
      return true;
    }
    $('code').addEventListener('input', () => { $('ctl-code').classList.remove('is-invalid'); hide('code-message'); });
    $('code').addEventListener('keydown', (event) => { if (event.key === 'Enter') { $('btn-verify').click(); } });

    function emailMessage(kind, text) { $('email-message').className = `message ${kind}`; $('email-message-text').textContent = text; show('email-message'); }
    const PASSWORD_RULE = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!-/:-@[-`{-~])[!-~]{8,15}$/;
    async function sendCode() {
      const loginId = $('login-id').value.trim().toLowerCase();
      const email = $('email').value.trim().toLowerCase();
      $('ctl-login-id').classList.remove('is-invalid');
      $('ctl-email').classList.remove('is-invalid');
      hide('login-id-error', 'email-message');
      if (!loginId) { $('ctl-login-id').classList.add('is-invalid'); show('login-id-error'); }
      if (!EMAIL_RULE.test(email)) { emailError('이메일 형식이 올바르지 않습니다.'); }
      if (!loginId || !EMAIL_RULE.test(email)) { return; }
      setLoading($('btn-send'), '발송 중...');
      await wait(500);
      setLabel($('btn-send'), codeLeft > 0 ? '재발송' : '인증번호 발송');
      if (!REGISTERED[email] || REGISTERED[email].loginId !== loginId) { emailError('아이디와 이메일이 일치하는 회원이 없습니다.'); return; }
      if (email === 'mailfail@example.com') { flash('error', '메일을 보내지 못했습니다.', '잠시 후 다시 시도해 주세요.'); return; }
      startCode();
    }
    function verify() {
      if (!checkCode()) { return; }
      hide('code-field');
      verified();
      $('new-password').focus();
    }
    async function resetPassword() {
      const next = $('new-password').value;
      const check = $('new-check').value;
      $('ctl-new').classList.toggle('is-invalid', !PASSWORD_RULE.test(next));
      $('new-error').classList.toggle('is-hidden', PASSWORD_RULE.test(next));
      $('ctl-check').classList.toggle('is-invalid', next !== check || !check);
      $('check-error').classList.toggle('is-hidden', next === check && Boolean(check));
      if (!PASSWORD_RULE.test(next) || next !== check) { return; }
      $('btn-reset').innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>변경 중...';
      $('btn-reset').classList.add('disabled');
      await wait(500);
      // 모든 입력칸·버튼 잠금 + 안내 + 1.5초 뒤 로그인 화면 (D-116)
      $('btn-reset').textContent = '비밀번호 변경';
      ['new-password', 'new-check'].forEach((id) => { $(id).disabled = true; });
      ['ctl-new', 'ctl-check'].forEach((id) => $(id).classList.add('is-locked'));
      $('btn-change').disabled = true;
      show('toast-reset');
      setTimeout(() => { location.href = 'login_view.html?state=password-reset'; }, 1500);
    }
    // 칸을 떠날 때 형식·불일치 검사 (회원가입과 같음: 빈 칸은 검사하지 않는다)
    $('new-password').addEventListener('blur', () => {
      const bad = Boolean($('new-password').value) && !PASSWORD_RULE.test($('new-password').value);
      $('ctl-new').classList.toggle('is-invalid', bad);
      $('new-error').classList.toggle('is-hidden', !bad);
    });
    $('new-check').addEventListener('blur', () => {
      const bad = Boolean($('new-check').value) && $('new-check').value !== $('new-password').value;
      $('ctl-check').classList.toggle('is-invalid', bad);
      $('check-error').classList.toggle('is-hidden', !bad);
    });
    $('btn-send').addEventListener('click', sendCode);
    $('btn-verify').addEventListener('click', verify);
    $('btn-reset').addEventListener('click', (event) => { event.preventDefault(); if (!$('btn-reset').classList.contains('disabled')) { resetPassword(); } });
    // [변경]: 인증 취소, 아이디·이메일 다시 입력 (D-039 와 같음)
    $('btn-change').addEventListener('click', () => {
      ['login-id', 'email'].forEach((id) => { $(id).disabled = false; });
      ['ctl-login-id', 'ctl-email'].forEach((id) => $(id).classList.remove('is-locked'));
      hide('btn-change', 'verified-pill', 'password-area', 'email-message');
      show('btn-send');
      setLabel($('btn-send'), '인증번호 발송');
      codeLeft = 0;
    });
    ['login-id', 'email'].forEach((id) => $(id).addEventListener('input', () => {
      if (codeLeft > 0) { timer.stop(); codeLeft = 0; hide('code-field'); setLabel($('btn-send'), '인증번호 발송'); }
      $(`ctl-${id}`).classList.remove('is-invalid');
      hide(id === 'email' ? 'email-message' : 'login-id-error');
    }));

    function resetState() {
      clearFlash();
      if (typeof timer !== 'undefined') { timer.stop(); codeLeft = 0; codeFails = 0; }
      hide('login-id-error', 'email-message', 'code-field', 'code-message', 'password-area', 'verified-pill', 'btn-change', 'new-error', 'check-error');
      show('btn-send');
      ['ctl-login-id', 'ctl-email', 'ctl-code', 'ctl-new', 'ctl-check'].forEach((id) => $(id).classList.remove('is-invalid', 'is-locked'));
      ['login-id', 'email', 'code', 'new-password', 'new-check'].forEach((id) => { $(id).value = ''; $(id).disabled = false; });
      $('timer').textContent = '4:59';
      $('btn-send').disabled = false; $('btn-send').textContent = '인증번호 발송';
      $('btn-verify').disabled = false; $('btn-verify').textContent = '확인';
      $('btn-reset').textContent = '비밀번호 변경'; $('btn-reset').classList.remove('disabled');
    }
    function filled() { $('login-id').value = 'todo2026'; $('email').value = 'user@example.com'; }
    function sent() { filled(); show('code-field'); $('btn-send').disabled = true; $('btn-send').textContent = '재발송 0:59'; }
    function verified() {
      filled();
      ['login-id', 'email'].forEach((id) => { $(id).disabled = true; });
      ['ctl-login-id', 'ctl-email'].forEach((id) => $(id).classList.add('is-locked'));
      hide('btn-send'); show('btn-change', 'verified-pill', 'password-area');
      $('email-message').className = 'message is-success'; $('email-message-text').textContent = '인증되었습니다.'; show('email-message');
    }
    function codeError(text) { $('ctl-code').classList.add('is-invalid'); $('code-message').className = 'message is-error'; $('code-message-text').textContent = text; show('code-message'); }
    function emailError(text) { $('ctl-email').classList.add('is-invalid'); $('email-message').className = 'message is-error'; $('email-message-text').textContent = text; show('email-message'); }

    const STATES = {
      'default': { label: '기본', run: () => {} },
      'from-find-id': { label: '아이디 찾기에서 넘어옴 (칸 채움)', run: filled },
      'input-error': { label: '아이디 빈 값 / 이메일 형식 오류', run: () => { $('ctl-login-id').classList.add('is-invalid'); show('login-id-error'); $('email').value = 'user@'; emailError('이메일 형식이 올바르지 않습니다.'); } },
      'no-account': { label: '일치하는 회원 없음', run: () => { filled(); emailError('아이디와 이메일이 일치하는 회원이 없습니다.'); } },
      'sent': { label: '인증번호 발송 후', run: () => { sent(); $('email-message').className = 'message is-success'; $('email-message-text').textContent = '인증번호를 보냈습니다. 메일을 확인해 주세요.'; show('email-message'); } },
      'code-wrong': { label: '인증번호 틀림', run: () => { sent(); codeError('인증번호가 틀렸습니다. (남은 횟수 4회)'); } },
      'code-expired': { label: '인증번호 만료', run: () => { sent(); $('timer').textContent = '0:00'; $('btn-send').disabled = false; $('btn-send').textContent = '재발송'; codeError('인증번호가 만료되었습니다. 다시 발송해 주세요.'); } },
      'code-locked': { label: '5번 틀려 무효', run: () => { sent(); $('btn-send').disabled = false; $('btn-send').textContent = '재발송'; codeError('인증번호가 무효가 되었습니다. 다시 발송해 주세요.'); } },
      'verified': { label: '인증 완료 (새 비밀번호 구역 표시)', run: verified },
      'password-error': { label: '새 비밀번호 입력 오류', run: () => { verified(); ['ctl-new', 'ctl-check'].forEach((id) => $(id).classList.add('is-invalid')); show('new-error', 'check-error'); } },
      'resetting': { label: '변경 중', run: () => { verified(); $('btn-reset').innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>변경 중...'; $('btn-reset').classList.add('disabled'); } },
      'reset-done': { label: '변경 완료 (모두 잠김, → 로그인)', run: () => {
        verified();
        ['new-password', 'new-check'].forEach((id) => { $(id).value = 'abcd123!'; $(id).disabled = true; });
        ['ctl-new', 'ctl-check'].forEach((id) => $(id).classList.add('is-locked'));
        $('btn-change').disabled = true; $('btn-reset').classList.add('disabled');
        show('toast-reset');
      } },
      'expired-30': { label: '인증 30분 지남', run: () => { filled(); emailError('인증 시간이 지났습니다. 다시 인증해 주세요.'); } },
      'account-gone': { label: '그사이 탈퇴 (404)', run: () => show('toast-gone') },
      'mail-failed': { label: '메일 발송 실패', run: () => { filled(); show('toast-mail-failed'); } },
      'server-error': { label: '서버 오류', run: () => show('toast-server') },
    };
    setupStates(STATES, () => { resetState(); $('btn-change').disabled = false; });
  </script>
</body>
</html>
