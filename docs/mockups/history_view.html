<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>히스토리 시안</title>
  <link rel="stylesheet" href="../../frontend/node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="mockup_common.css" />
  <style>
    /* HistoryView_screen.md "7. 디자인 값" */
    .history-card { background: #fff; border: 1px solid var(--color-border); border-radius: 16px; padding: 20px; }
    .history-title { font-size: 17px; font-weight: 800; margin: 0; }
    .history-count { font-size: 14px; font-weight: 600; color: var(--color-muted); margin-left: 4px; }
    .history-guide { font-size: 13px; color: var(--color-sub); margin: 4px 0 16px; }
    .history-table { table-layout: fixed; }
    .history-table tbody tr { cursor: pointer; }
    .muted { color: var(--color-muted); }
    .history-table .col-period { width: 140px; }
    .history-table td.col-period { line-height: 1.4; padding-top: 8px; padding-bottom: 8px; }
    .history-table .col-done { width: 120px; }
    .history-table .col-assignee { width: 160px; }
    .row-sub { display: none; font-size: 12px; color: var(--color-sub); margin-top: 2px; }
    .title-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .muted { color: var(--color-muted); }
    .pager { display: flex; justify-content: center; gap: 4px; margin-top: 16px; }
    .pager button { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--color-sub); font-size: 14px; font-weight: 600; }
    .pager button:hover:not(:disabled) { background: var(--color-hover-bg); }
    .pager button.is-current { background: var(--color-primary); color: #fff; }
    .pager button:disabled { color: var(--color-border-strong); }
    .detail-item { margin-bottom: 14px; }
    .detail-label { font-size: 13px; font-weight: 600; color: var(--color-sub); margin-bottom: 4px; }
    .detail-value { font-size: 15px; word-break: break-all; }
    .detail-content { white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    .log-section { border-top: 1px solid var(--color-border); padding-top: 16px; }
    .log-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
    .log-title span { color: var(--color-muted); font-weight: 600; margin-left: 2px; }
    .log-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .log-row { padding: 10px 12px; border-radius: 10px; }
    .log-type { font-size: 14px; font-weight: 600; }
    .log-meta { font-size: 12px; color: var(--color-sub); margin-top: 2px; }
    @media (max-width: 767.98px) {
      .history-table .col-period, .history-table .col-assignee { display: none; }
      .row-sub { display: block; }
      .history-table td { height: auto; padding-top: 8px; padding-bottom: 8px; }
    }
  </style>
</head>
<body>
  <!-- 시안 (D-146, D-149): 서버 없이 이 화면 안에서만 동작한다 -->
  <div class="mockup-bar">
    <span>시안 상태</span><select id="state-select" class="form-select form-select-sm"></select>
    <span>· 공간: <a href="history_view.html">개인</a> / <a href="history_view.html?space=team">팀</a> · 화면 문서: HistoryView_screen.md</span>
  </div>

  <div class="main-layout">
    <nav id="side-nav" class="side-nav" aria-label="공간"></nav>
    <nav id="menu-tabs" class="menu-tabs" aria-label="메뉴"></nav>
    <main class="content">
      <section class="history-card">
        <h1 class="history-title">히스토리<span id="history-count" class="history-count">(47개)</span></h1>
        <p class="history-guide">완료한 지 7일이 지난 작업입니다.</p>
        <table id="history-table" class="table-x history-table">
          <thead><tr><th>제목</th><th class="col-period">기간</th><th class="col-done">완료일</th><th class="col-assignee team-only">작업자</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
        <div id="history-empty" class="empty-box is-hidden"><i class="bi bi-clock-history"></i>히스토리가 없습니다.<span class="empty-sub">완료한 지 7일이 지난 작업이 여기에 모입니다.</span></div>
        <div id="history-loading" class="loading-box is-hidden"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>불러오는 중...</div>
        <div id="pager" class="pager"></div>
      </section>
    </main>
  </div>

  <!-- 상세 모달 (D-112) -->
  <div id="detail-modal" class="modal-backdrop-x is-hidden">
    <div class="modal-x is-wider" role="dialog" aria-label="히스토리 작업 상세">
      <div class="modal-title-x">작업 상세<button type="button" id="h-x" class="icon-button" aria-label="닫기"><i class="bi bi-x-lg"></i></button></div>
      <div class="detail-item"><div class="detail-label">상태</div><span class="badge-x badge-history">히스토리</span></div>
      <div class="detail-item"><div class="detail-label">제목</div><div id="h-title" class="detail-value"></div></div>
      <div class="detail-item"><div class="detail-label">기간</div><div id="h-period" class="detail-value"></div></div>
      <div class="detail-item"><div class="detail-label">완료일</div><div id="h-done" class="detail-value"></div></div>
      <div class="detail-item team-only"><div class="detail-label">작업자</div><div id="h-assignee" class="detail-value"></div></div>
      <div class="detail-item"><div class="detail-label">내용</div><div id="h-content" class="detail-value detail-content"></div></div>
      <div class="log-section">
        <div class="log-title">수정 내역<span id="log-count"></span></div>
        <div id="log-loading" class="loading-box is-hidden"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span></div>
        <div id="log-list" class="log-list"></div>
      </div>
      <div class="modal-actions"><button type="button" id="h-close" class="btn-x btn-outline-x">닫기</button></div>
    </div>
  </div>

  <script src="../../frontend/node_modules/sortablejs/Sortable.min.js"></script>
  <script src="mockup_common.js"></script>
  <script src="history_view.js"></script>
</body>
</html>
