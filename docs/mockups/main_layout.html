<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공통 레이아웃 시안</title>
  <link rel="stylesheet" href="../../frontend/node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../frontend/node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="mockup_common.css" />
  <style>
    /* MainLayout_screen.md 시안. 내용 영역은 각 화면 시안에 있다 */
    .content-placeholder { background: #fff; border-radius: 16px; border: 1px dashed var(--color-border); padding: 40px 20px; text-align: center; color: var(--color-sub); }
    .content-placeholder a { color: var(--color-primary-dark); font-weight: 700; }
  </style>
</head>
<body>
  <div class="mockup-bar"><span>시안 상태</span><select id="state-select" class="form-select form-select-sm"></select><span>· 화면 문서: MainLayout_screen.md</span></div>

  <div class="main-layout">
    <nav id="side-nav" class="side-nav" aria-label="공간"></nav>
    <nav id="menu-tabs" class="menu-tabs" aria-label="메뉴"></nav>
    <main class="content">
      <h1 id="content-title" class="page-title">작업</h1>
      <div class="content-placeholder">
        내용 영역입니다. 메뉴 탭을 누르면 각 화면 시안으로 이동합니다.<br />
        <a href="task_view.html">작업</a> · <a href="calendar_view.html">캘린더</a> · <a href="team_info_view.html">팀 정보</a> · <a href="history_view.html">히스토리</a> · <a href="profile_view.html">회원정보 수정</a>
      </div>
    </main>
  </div>

  <script src="mockup_common.js"></script>
  <script>
    addToast('toast-server', 'error', '일시적인 오류가 발생했습니다.', '잠시 후 다시 시도해 주세요.');
    addToast('toast-expired', 'error', '로그인이 만료되었습니다.', '다시 로그인해 주세요.');
    addToast('toast-removed', 'error', '팀에서 내보내졌습니다.', '');
    addToast('toast-dissolved', 'error', '팀이 해체되었습니다.', '');
    addToast('toast-not-found', 'error', '팀을 찾을 수 없습니다.', '');
    addToast('toast-joined', 'success', '프로젝트 A 개발팀 팀에 가입했습니다.', '');
    addToast('toast-limit', 'error', '가입된 팀이 20개라 더 가입할 수 없습니다.', '');

    let currentSpace = '';
    function layout(space, tab, hideTabs) {
      if (currentSpace !== `${space}-${hideTabs}`) {
        renderLayout({ space, tab, hideTabs });
        currentSpace = `${space}-${hideTabs}`;
      }
      $('content-title').textContent = hideTabs ? '회원정보 수정' : '작업';
    }
    function openNotifications() { show('notification-box'); $('bell').classList.add('is-open'); }
    function openTeamModal() { show('team-create-modal'); }

    const STATES = {
      'default': { label: '기본 (개인, 작업 탭)', run: () => layout('personal', 'tasks', false) },
      'team': { label: '팀 공간 (메뉴 탭 4개)', run: () => layout('team', 'tasks', false) },
      'no-team': { label: '팀 없음', run: () => { layout('personal', 'tasks', false); hide('team-list'); show('team-empty'); } },
      'notification': { label: '알림 창 열림 (초대·작업자 지정·마감 임박)', run: () => { layout('personal', 'tasks', false); openNotifications(); } },
      'notification-read': { label: '알림 창 연 뒤 (모두 읽음, 배지 숨김)', run: () => { layout('personal', 'tasks', false); openNotifications(); hide('bell-badge'); document.querySelectorAll('.notification-item').forEach((item) => item.classList.remove('is-unread')); } },
      'notification-empty': { label: '알림 없음', run: () => { layout('personal', 'tasks', false); openNotifications(); hide('notification-list', 'bell-badge'); show('notification-empty'); } },
      'accepting': { label: '초대 수락 중', run: () => { layout('personal', 'tasks', false); openNotifications(); setLoading($('btn-accept'), '수락'); } },
      'accepted': { label: '초대 수락 완료 (팀 목록 맨 위)', run: () => { layout('personal', 'tasks', false); show('toast-joined'); } },
      'accept-limit': { label: '초대 수락 실패 (20개 제한)', run: () => { layout('personal', 'tasks', false); openNotifications(); show('toast-limit'); } },
      'badge-many': { label: '안 본 알림 많음 (99+)', run: () => { layout('personal', 'tasks', false); $('bell-badge').textContent = '99+'; } },
      'profile-menu': { label: '회원 메뉴 열림', run: () => { layout('personal', 'tasks', false); show('profile-menu'); $('profile-button').classList.add('is-open'); } },
      'long-text': { label: '긴 닉네임·이메일·팀 이름', run: () => { layout('personal', 'tasks', false); $('nickname').textContent = '가나다라마바사아'; $('email').textContent = 'very.long.email.address.for.test@example-company.com'; document.querySelector('#team-list .nav-text').textContent = '아주아주긴팀이름스무자까지들어가요'; } },
      'logout-loading': { label: '로그아웃 중', run: () => { layout('personal', 'tasks', false); show('profile-menu'); $('profile-button').classList.add('is-open'); $('btn-logout').innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>로그아웃 중...'; } },
      'team-create': { label: '팀 만들기 모달 (입력 전)', run: () => { layout('personal', 'tasks', false); openTeamModal(); } },
      'team-create-error': { label: '팀 만들기 입력 오류', run: () => { layout('personal', 'tasks', false); openTeamModal(); $('ctl-team-name').classList.add('is-invalid'); $('team-name-error-text').textContent = '팀 이름을 입력해 주세요.'; show('team-name-error'); } },
      'team-creating': { label: '팀 만드는 중', run: () => { layout('personal', 'tasks', false); openTeamModal(); $('team-name-input').value = '마케팅팀'; $('btn-team-create').innerHTML = '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>만드는 중...'; $('btn-team-create').classList.add('disabled'); } },
      'team-limit': { label: '팀 만들기 실패 (20개 제한)', run: () => { layout('personal', 'tasks', false); openTeamModal(); $('team-name-input').value = '마케팅팀'; $('ctl-team-name').classList.add('is-invalid'); $('team-name-error-text').textContent = '가입된 팀이 20개라 더 만들 수 없습니다.'; show('team-name-error'); } },
      'team-drag': { label: '팀 목록 드래그 중', run: () => {
        layout('personal', 'tasks', false);
        const items = document.querySelectorAll('#team-list .nav-item');
        items[2].classList.add('is-dragging');
        const line = document.createElement('div');
        line.className = 'nav-drop-line';
        items[0].before(line);
      } },
      'profile-page': { label: '회원정보 수정 화면 (탭 숨김, 선택 없음)', run: () => layout('none', null, true) },
      'session-expired': { label: '로그인 만료 (D-118)', run: () => { layout('personal', 'tasks', false); show('toast-expired'); } },
      'team-removed': { label: '팀에서 내보내짐 (실시간, D-104)', run: () => { layout('personal', 'tasks', false); show('toast-removed'); } },
      'team-dissolved': { label: '팀 해체됨 (실시간, D-104)', run: () => { layout('personal', 'tasks', false); show('toast-dissolved'); } },
      'team-not-found': { label: '속하지 않은 팀 주소 (404)', run: () => { layout('personal', 'tasks', false); show('toast-not-found'); } },
      'server-error': { label: '서버 오류', run: () => { layout('personal', 'tasks', false); show('toast-server'); } },
    };

    setupStates(STATES, () => { hideAllToasts(); if (currentSpace) { resetLayout(); } });
  </script>
</body>
</html>
